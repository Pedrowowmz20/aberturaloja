<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft Teams</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

#glitch {
    position: fixed;
    inset: 0;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: shake 0.08s infinite;
}

#text {
    color: #ff2222;
    font-family: monospace;
    font-size: clamp(20px, 4vw, 50px);
    font-weight: bold;
    text-align: center;
    text-shadow:
        5px 0 #00ffff,
        -5px 0 #ff00ff;
    animation: flicker 0.15s infinite;
}

.scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.08) 4px
    );
    pointer-events: none;
}

@keyframes shake {
    0%   { transform: translate(0,0) skew(0deg); }
    25%  { transform: translate(-8px,3px) skew(2deg); }
    50%  { transform: translate(7px,-4px) skew(-2deg); }
    75%  { transform: translate(-4px,-2px) skew(1deg); }
    100% { transform: translate(0,0) skew(0deg); }
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}
</style>
</head>

<body>

<div id="glitch">
    <div id="text">
        ⚠ SYSTEM ERROR ⚠<br><br>
        DISPLAY FAILURE
    </div>
    <div class="scanlines"></div>
</div>

<script>
setTimeout(function() {
    document.body.innerHTML = `
        <div style="
            width:100vw;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            color:white;
            font-family:Arial,sans-serif;
            font-size:32px;
            text-align:center;">
            😈<br><br>
            Foste trollado!
        `;
}, 10000);
</script>

</body>
</html>
