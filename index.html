<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRITICAL SYSTEM ERROR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#050505;color:#fff;cursor:none}
#screen{
  position:fixed;inset:0;
  background:radial-gradient(circle,#260000 0%,#050000 70%);
  animation:pulse .25s infinite alternate;
}
@keyframes pulse{to{filter:brightness(1.8)}}

.warning{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;z-index:2;
}
.warning h1{
  color:#ff0000;font-size:clamp(40px,8vw,100px);
  margin:0;text-shadow:0 0 20px red;
  animation:shake .08s infinite;
}
.warning p{font-size:22px;color:#ff7777}
@keyframes shake{
  0%{transform:translate(2px,-1px)}
  50%{transform:translate(-2px,2px)}
  100%{transform:translate(1px,1px)}
}

.popup{
  position:absolute;
  width:300px;
  background:#111;
  border:3px solid #ff0000;
  box-shadow:0 0 25px #f00;
  color:#fff;
  z-index:5;
  animation:appear .12s ease-out;
}
.popup .bar{
  background:#c00;
  padding:7px 10px;
  font-weight:bold;
}
.popup .content{padding:18px}
.popup button{
  background:#d00000;color:white;border:1px solid white;
  padding:6px 18px;cursor:pointer;
}
@keyframes appear{
  from{transform:scale(.2) rotate(10deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

#reveal{
  display:none;position:fixed;inset:0;
  background:#050505;z-index:100;
  align-items:center;justify-content:center;
  text-align:center;
}
#reveal h2{font-size:70px;color:#00ff66}
#reveal p{font-size:24px;color:white}
</style>
</head>
<body>

<div id="screen"></div>

<div class="warning">
  <h1>SYSTEM FAILURE</h1>
  <p>⚠ CRITICAL ERROR DETECTED ⚠</p>
  <p id="counter">SYSTEM FAILURE: 100%</p>
</div>

<div id="popups"></div>

<div id="reveal">
  <div>
    <h2>😂 ERA UMA PARTIDA!</h2>
    <p>Nada aconteceu ao teu computador.</p>
    <button onclick="location.reload()">Fechar partida</button>
  </div>
</div>

<script>
const messages=[
  "CRITICAL SYSTEM ERROR",
  "MEMORY CORRUPTION DETECTED",
  "WINDOWS FAILURE",
  "HARDWARE ERROR",
  "SYSTEM FILES DAMAGED",
  "UNAUTHORIZED PROCESS DETECTED",
  "EMERGENCY SHUTDOWN",
  "KERNEL ERROR",
  "SYSTEM INSTABILITY",
  "RECOVERY FAILED"
];

let count=100;
let running=true;

function popup(){
  if(!running)return;

  const p=document.createElement("div");
  p.className="popup";

  const x=Math.max(5,Math.random()*(innerWidth-310));
  const y=Math.max(5,Math.random()*(innerHeight-180));

  p.style.left=x+"px";
  p.style.top=y+"px";

  const msg=messages[Math.floor(Math.random()*messages.length)];

  p.innerHTML=`
    <div class="bar">⚠ ${msg}</div>
    <div class="content">
      <b>ERRO 0x000000F4</b><br><br>
      Falha crítica do sistema.<br>
      Tentativa de recuperação...<br><br>
      <button onclick="this.closest('.popup').remove()">OK</button>
    </div>
  `;

  document.getElementById("popups").appendChild(p);

  setTimeout(()=>p.remove(),7000);
}

const interval=setInterval(()=>{
  if(!running)return;

  popup();
  popup();

  count-=Math.floor(Math.random()*5)+1;
  if(count<0)count=0;

  document.getElementById("counter").textContent=
    "SYSTEM FAILURE: "+count+"%";

  if(count===0){
    clearInterval(interval);
    setTimeout(()=>{
      running=false;
      document.getElementById("reveal").style.display="flex";
    },2500);
  }
},650);
</script>

</body>
</html>
